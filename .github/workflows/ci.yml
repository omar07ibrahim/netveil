name: CI

on:
  push:
    branches:
      - master
      - agent/remove-legacy-endpoints
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  quality:
    name: Locked offline quality suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the immutable event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up the evidence runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: requirements-ci-py312.lock

      - name: Assert the event boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "omar07ibrahim/Hello-World"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME" in
            push)
              test "$GITHUB_REF" = "refs/heads/master" ||
                test "$GITHUB_REF" = "refs/heads/agent/remove-legacy-endpoints"
              ;;
            pull_request)
              [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
              ;;
            *)
              exit 1
              ;;
          esac
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.12.3"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${NETVEIL_KEY:-}"
          test "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)" = ""

      - name: Install only the hash-locked environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --require-hashes \
            --requirement requirements-ci-py312.lock
          test "$(python -m pip --version | awk '{print $2}')" = "26.1.2"
          python -m pip check

      - name: Run tests, coverage, lint, types, and evidence checks
        shell: bash
        run: |
          set -euo pipefail
          export COVERAGE_FILE="$RUNNER_TEMP/.coverage"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          python -m coverage run -m unittest discover -s tests
          python -m coverage report --fail-under=99
          ruff check --no-cache .
          ruff format --check --no-cache .
          mypy --cache-dir "$RUNNER_TEMP/mypy-cache"
          python tools/render_architecture.py --check
          python tools/render_evidence.py --check
          test "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)" = ""

  release:
    name: Reproducible wheel and guarded CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the immutable event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up the evidence runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: requirements-ci-py312.lock

      - name: Assert the release boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "omar07ibrahim/Hello-World"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.12.3"
          command -v strace >/dev/null
          test -z "${OPENAI_API_KEY:-}"
          test -z "${NETVEIL_KEY:-}"
          test "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)" = ""

      - name: Install only the hash-locked environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --require-hashes \
            --requirement requirements-ci-py312.lock
          test "$(python -m pip --version | awk '{print $2}')" = "26.1.2"
          python -m pip check

      - name: Build and verify twice
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          build_and_verify() {
            local label="$1"
            local out="$RUNNER_TEMP/release-$label"
            python tools/build_release.py \
              "$GITHUB_WORKSPACE" \
              "$out" \
              --source-date-epoch "$epoch" \
              --python "$(command -v python)"
            python tools/verify_fresh_wheel.py \
              --source-commit "$GITHUB_SHA" \
              --inventory "$out/release-inventory.json" \
              --sdist "$out/netveil_audit-0.3.0.tar.gz" \
              "$out/netveil_audit-0.3.0-py3-none-any.whl" \
              > "$out/fresh-wheel-verification.json"
          }
          build_and_verify a
          build_and_verify b
          cmp \
            "$RUNNER_TEMP/release-a/netveil_audit-0.3.0-py3-none-any.whl" \
            "$RUNNER_TEMP/release-b/netveil_audit-0.3.0-py3-none-any.whl"
          cmp \
            "$RUNNER_TEMP/release-a/netveil_audit-0.3.0.tar.gz" \
            "$RUNNER_TEMP/release-b/netveil_audit-0.3.0.tar.gz"
          cmp \
            "$RUNNER_TEMP/release-a/release-inventory.json" \
            "$RUNNER_TEMP/release-b/release-inventory.json"
          FIRST="$RUNNER_TEMP/release-a/fresh-wheel-verification.json" \
          SECOND="$RUNNER_TEMP/release-b/fresh-wheel-verification.json" \
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          first = json.loads(Path(os.environ["FIRST"]).read_bytes())
          second = json.loads(Path(os.environ["SECOND"]).read_bytes())
          for document in (first, second):
              if document.get("status") != "pass":
                  raise SystemExit("fresh-wheel verifier did not pass")
              if document.get("source_commit") != os.environ["GITHUB_SHA"]:
                  raise SystemExit("fresh-wheel verifier source drift")
          # pip rewrites the installed launcher for each absolute venv path, so
          # launcher/RECORD identities are expected to differ. Every portable
          # claim and both independent verifier outcomes must remain identical.
          first.pop("installed")
          second.pop("installed")
          if first != second:
              raise SystemExit("path-independent verification claims differ")
          PYTHON
          test "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)" = ""
