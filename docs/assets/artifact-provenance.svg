<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="825" viewBox="0 0 1440 825" role="img" aria-labelledby="title description">
<title id="title">Netveil release evidence chain</title>
<desc id="description">Source commit, artifact inventory, installed-file, and fresh execution evidence with an explicit unsigned non-claim.</desc>
<style>
.bg{fill:#07111f}
.panel{fill:#101d31;stroke:#29405e;stroke-width:1.5}
