<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="825" viewBox="0 0 1440 825" role="img" aria-labelledby="title description">
<title id="title">Netveil release evidence chain</title>
<desc id="description">Source commit, artifact inventory, installed-file, and fresh execution evidence with an explicit unsigned non-claim.</desc>
<style>
.bg{fill:#07111f}
.panel{fill:#101d31;stroke:#29405e;stroke-width:1.5}
.panel-alt{fill:#0c1728;stroke:#29405e;stroke-width:1.5}
.title{fill:#f4f8ff;font:700 30px DejaVu Sans,Arial,sans-serif}
.subtitle{fill:#a8b7c9;font:15px DejaVu Sans,Arial,sans-serif}
.label{fill:#f4f8ff;font:600 16px DejaVu Sans,Arial,sans-serif}
.small{fill:#a8b7c9;font:13px DejaVu Sans,Arial,sans-serif}
.mono{fill:#f4f8ff;font:13px DejaVu Sans Mono,ui-monospace,SFMono-Regular,Consolas,monospace}
.mono-small{fill:#a8b7c9;font:12px DejaVu Sans Mono,ui-monospace,SFMono-Regular,Consolas,monospace}
.pass{fill:#86efac;font:600 13px DejaVu Sans,Arial,sans-serif}
.warn{fill:#fcd34d;font:600 13px DejaVu Sans,Arial,sans-serif}
</style>
<rect class="bg" width="1440" height="825" rx="18"/>
<text x="48" y="56" class="title">Release evidence chain</text>
<text x="48" y="86" class="subtitle">Every displayed value comes from the canonical release inventory or fresh-wheel verifier JSON.</text>
