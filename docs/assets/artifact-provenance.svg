<text x="78" y="674" class="warn">Claim boundary</text>
<text x="78" y="709" class="small">The manifest is unsigned. It shows internally consistent bytes and an executed test run; it does not prove publisher identity, an honest host, or an unmodified verifier.</text>
<text x="78" y="741" class="small">Authenticate the published artifact digests through a separate trusted channel.</text>
